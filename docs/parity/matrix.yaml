# Parity matrix: the editable definition of done (ADR-0008).
#
# Each row is one user-visible capability. The generator in
# internal/tools/paritygen validates this file and regenerates matrix.md.
# See docs/parity/limitations.md for every row with status: excluded.
#
# Schema: rewrite spec §17. Supported YAML is deliberately narrow: a top-level
# sequence of rows, scalar fields, block string sequences, and bracketed
# inline string sequences. Comments must occupy a whole line.
#
# Row seeding follows delivery: tickets seed their own rows as they land, so
# the full ~300-row inventory arrives with ticket 60. Module names use the
# repository's actual package paths (root-level layers), which internal/archtest
# enforces; rewrite spec §2's internal/ prefix describes the same layers.

