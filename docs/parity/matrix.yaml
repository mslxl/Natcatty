    - app.TestTicket41CheckPassesTwiceInOneProcess
  status: verified
  notes: "The command is written to the Session's existing interactive PTY as the bare text followed by CR, matching portable vendor CLIs; there is no shell wrapper, no completion marker, and no second channel, so single-channel devices work. Programmatic input bypasses the tap, so it never enters command history, autocomplete, or command tracking. Device CLIs expose no exit status, so HasExitCode is always false and callers must judge success from the output; the original's null exitCode is preserved. Output strips OSC and CSI sequences, removes carriage returns, drops an echoed first line, and trims, as the original's stripAnsi and post-processing did. Raw execution is available only to an SSH Host marked as a network device and to serial Sessions; a POSIX shell Session refuses it with a typed error. The original's English no-response hint string became the NoResponse flag, because the application layer holds no user-visible text."

- id: netdev.timeouts-and-cap
  area: terminal
  feature: Network-device commands finish on silence or fail on idle and overall limits
  original_paths:
    - electron/bridges/ai/ptyExec.cjs
    - electron/bridges/mcpServerBridge/execHandlers.cjs
  module: application/session
  tickets: [41]
  acceptance_tests:
    - application/session.TestRawExecFinishesAfterTheIdleWindow
    - application/session.TestRawExecReportsNoResponseInsteadOfHanging
    - application/session.TestRawExecOverallTimeoutInterruptsTheCommand
    - application/session.TestRawExecCancellationInterruptsTheCommand
    - application/session.TestRawExecCapsTheOutputAndMarksItTruncated
    - app.TestTicket41CheckRunsThroughTheKeyboard
    - app.TestTicket41CheckPassesTwiceInOneProcess
  status: verified
  notes: "Completion is inferred, not marked: the command finishes after three seconds of silence by default, with the first two chunks getting a doubled idle window so a paging command is not cut short after its echo. A device that answers nothing resolves after min(idle*4, timeout/4) with NoResponse set rather than waiting for silence that never starts, matching the original fallback. An overall timeout sends Ctrl+C and fails with a typed timeout, and cancellation does the same; partial output is returned with either. Output is capped at 512 KiB by default; after the cap is reached the idle timer is armed once and never reset, so a noisy device cannot hold the command open until the overall limit. This differs from the original only in truncating exactly at the cap instead of letting the last chunk overshoot, and in reporting Truncated/NoResponse flags instead of English hint text."

