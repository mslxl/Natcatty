  notes: "The SSH version recorder already captures the server identification line, and RemoteRequiresSingleChannel recognizes the BHostSSH, TERM-SSHD, CLOUDBILITY, and CLOUDLINKER software tokens; a lease for such a peer is marked single-channel and is never parked for reuse. Network-device raw mode needs no extra channel at all: the command is typed into the same PTY that was opened for the shell, so exactly one session channel is created and no exec or subsystem request is sent. The fixture extends fakessh with a scripted shell, a configurable server version, and a session-channel counter so the adapter test and self-test assert the wire behavior."

