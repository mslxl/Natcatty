    - app.TestTicket56CheckRunsThroughTheKeyboard
  status: verified
  notes: "Read tools project the original result shapes from application services without UI coupling: environment and terminal context, Vault hosts/notes/identities/proxy profiles/groups/snippets, SFTP list/read/stat/home, and Port Forwarding rules/tunnels. Bounds match the original where it has them: note excerpts use UTF-16 offsets capped at 6000 units with a 120-code-point title and a 200-character query, terminal context defaults to 80 lines and caps at 300, and in-memory SFTP reads follow the original 10 MB ceiling, refusing larger files with the original guidance instead of truncating them. SFTP listings stop at 5000 entries with a truncated marker, and the stdio layer caps one tool result at 16 MiB, above the 10 MB read ceiling to leave room for JSON escaping. An unmatched note query reports matchOffset null, as the original does. The environment description is shorter than the original's generated tool guidance; the host, count, and tunnel fields are projected from live sessions. Write tools and subsystems the native build does not have return explicit bounded errors; they are never silently executed."

