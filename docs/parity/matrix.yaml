  notes: "Host content is loaded only from a loopback gateway on 127.0.0.2, which is loopback but outside the localhost/127.0.0.1/::1 hosts MyGo's development build auto-trusts for its typed bridge. The page gets no preload script and no TrustedOrigins, the app registers no MyGo bindings, permissions are denied, and window.open returns no window. The gateway replaces the page's CSP with default/connect/frame/worker/form restricted to 'self', object-src 'none', frame-ancestors 'none', no unsafe-eval, and script-src 'none' for non-HTML documents; it strips the page's meta CSP and refresh. Cross-origin fetch, image beacons, foreign frames/objects/forms, window.open, eval, and bridge calls are blocked. The ticket 48 GUI acceptance run loaded the hostile page in the real WebView: the page reported every attempt blocked (including a denied window.mygo call) and the fixture recorded zero requests to the foreign origin. A page-created popup that the original would open as a new tab is refused because MyGo cannot attach such a page to the panel's isolated route."

