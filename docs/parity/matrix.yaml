  notes: "Ctrl+C with a native child was re-probed with real keyboard input in a fresh process: with the terminal focused, one Ctrl+C terminates a native child such as ping -t, and at an idle prompt it prints ^C and returns a prompt. With a non-empty selection, the first Ctrl+C copies the selection and the next delivers SIGINT, matching Windows Terminal and MyGo's performable copy binding. The earlier synthetic probe's failure did not reproduce, and its focus and selection state was not recorded, so the difference is attributed to probe state rather than an app defect."

