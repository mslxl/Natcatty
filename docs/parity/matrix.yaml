  notes: "Each Resource (local, Host, Session) admits up to the queue's per-resource limit (1-16, default 6), and a multi-file row reports its current file and completed-file count. Pause stops at a chunk boundary; a directory Resume continues from its checkpoint while a single file replays, and Restart downgrades unfinished rows to interrupted with reconnect required. A second Transfer pressed while one runs is admitted to the queue instead of refused. A lost transport settles as connection with reconnect required, and Retry returns ErrTaskUnavailable rather than replaying the dead stream. The reconnect hint renders on its own wrapping line, so the complete sentence is visible in every locale at both 720x480 and 1100x720 instead of ending in an ellipsis. The center closes on a backdrop click, Escape, Dismiss, and its effective (rebindable) toggle chord even though the modal suppresses window shortcuts. A control refusal notice is cleared when the centre reopens and when a Host reconnect reattaches the row it named, so it never outlives the condition that produced it."

