    - ui/monitoring.TestViewRendersListChartsEditorAndNarrowWindow
    - app.TestTicket44CheckRunsThroughTheKeyboard
  status: verified
  notes: "The original Linux stats command reads /proc/stat, /proc/meminfo, /proc/net/dev, /proc/uptime, /proc/loadavg, hostname, and /etc/os-release, and the native implementation keeps the same labels and delta math: overall and per-core CPU are derived from the first and second raw counters, memory is total minus free, buffers, and cached, and network rates come from byte counters. Linux disks are a separate exec because a large combined request is rejected by Dropbear; the awk parser excludes network and FUSE capacity and counts a shared APFS capacity once. macOS keeps its sysctl/vm_stat/ps/netstat command and direct CPU percentage. GPU is best-effort through nvidia-smi and is absent rather than an error when the command is unavailable. Deliberate divergence: the GPU query runs inside the same metric exec on every sample, where the original cached a separate probe for 10-30 seconds; the two-second nvidia-smi timeout bounds the cost and every metric shares one round trip. An unknown OS is a typed unsupported state. A metric the reply does not carry is NaN (a dash), while a reply with no recognizable metric is a typed unsupported failure. Sampling runs in service goroutines through the connection layer's channel lease, never a terminal Session."

