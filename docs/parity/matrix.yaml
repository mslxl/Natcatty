    - app.TestTicket24CheckPassesTwiceInOneProcess
  status: verified
  notes: "Pure parsers in domain/vaultimport detect or accept each format and return neutral records. The application layer validates every record, compares its Host merge key (protocol, hostname, port, username, group) with the current Vault, and reports conflicts, in-file duplicates, and invalid source rows by row number before writing anything. The user selects rows and chooses Skip or Overwrite; there is no implicit overwrite. New Hosts and their missing ancestor Groups are saved in one SQLite transaction per 50-row chunk, and Next/Offset resumes a retried chunk without duplicate Hosts. Passwords, proxy passwords, and referenced IdentityFiles go through the field-secret store and Key inspector, so plaintext never enters a Host record or the database. Imported Hosts retain tags, notes, proxy settings, Key references, the SSH agent preference, and ProxyJump chains, and the preview exposes no credential material. Local-shell configuration has no native Host field, so a non-empty LocalShell cell is reported as an unsupported entry instead of being dropped silently."

- id: vault.csv-interchange
  area: vault
  feature: Read the Netcatty CSV interchange format and provide export-safe field encoding
  original_paths:
    - domain/vaultImport.ts
    - domain/vaultImport/csvUtils.ts
    - domain/vaultImport/csvCredentialFields.ts
    - domain/vaultImport/csvProxy.ts
  module: application/vault
  tickets: [24]
  acceptance_tests:
    - domain/vaultimport.TestParseCSVFixtureHandlesBOMCRLFAndQuoting
    - domain/vaultimport.TestCSVFormulaGuardRoundTrips
    - domain/vaultimport.TestMarkedFieldEncoding
    - domain/vaultimport.TestParseCSVRejectsMalformedQuoting
    - domain/vaultimport.TestParseCSVMissingHostnameColumn
    - domain/vaultimport.TestParseCSVAcceptsTabSeparated
    - application/vault.TestPreviewImportReportsConflictsDuplicatesAndInvalidRows
    - app.TestTicket24CheckRunsThroughTheKeyboard
  status: verified
  notes: "CSV follows RFC 4180 quoting, accepts a UTF-8 BOM, CRLF or LF row endings, and tab-separated files with the same headers. Header matching is case- and punctuation-insensitive, additional columns are ignored, and a missing hostname column is an error. Key paths, passphrases, and proxy URLs use versioned marked fields with percent encoding so a value that starts with a formula character stays unambiguous. Formula characters in exported free text are guarded with a leading apostrophe and the guard is removed on import; formulas are never evaluated, and credential cells stay byte-exact. A duplicate merge key inside one file is reported and left unselected. A LocalShell marked field is recognized but reported as unsupported because the native Host model does not store local-shell configuration. The export writer is covered by vault.export."

- id: vault.export
  area: vault
  feature: Export Vault, Snippets, notes, keys, themes, and logs and re-import them
  original_paths:
