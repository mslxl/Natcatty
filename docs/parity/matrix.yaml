  notes: "The v2 checkpoint is a fixed-width SHA-256 chain over source path, target path, size, and whole-millisecond mtime; legacy v1 digests remain valid and migrate. A deterministic dirs-first sorted plan yields totals, identities, and copy order. A resumed Transfer re-walks the tree, requires completed == covered, and skips the verified prefix. Paused and failed rows freeze progress to the checkpoint prefix, the chosen destination roots are pinned in Targets, and a restart keeps both across DowngradeInterrupted. Each row persists the saved Host behind its endpoints (`sourceHost`/`destHost`), so reconnecting a Host in the SFTP pane reaches Queue.ReattachHost and binds that Host's fresh filesystem to every matching interrupted row, including a row whose transport was lost, while an ordinary failure and a finished row keep their state; Resume then continues from the checkpoint and Retry remains a full replay. Rows persisted before the endpoint fields existed infer their direction from the request-ordered queue lanes, so a legacy upload's Host is its destination and a download's Host is its source. A row whose Host is still disconnected keeps the reconnect prompt and refuses Resume with ErrTaskUnavailable. A resumed queued Transfer stages each file under a name derived from its durable Task ID and target, so it reuses and promotes away the interrupted process's `.part` instead of leaving an orphan, while another task's staging file is untouched."

