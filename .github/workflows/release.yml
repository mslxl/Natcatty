name: release

# Builds and verifies the release artifacts for every supported platform. A
# pushed strict SemVer tag such as v0.1.0 additionally publishes a GitHub
# release with those artifacts; a tag with a pre-release suffix such as
# v0.1.0-rc.1 publishes a GitHub pre-release that is never marked Latest. Run
# it from the Actions tab (or `gh workflow run release.yml -f tag=v0.1.0`) to
# validate and build without publishing: workflow_dispatch is a dry run that
# creates no release.
#
# Releases stay unsigned apart from MyGo's ad hoc macOS signature and carry no
# notarization, Authenticode, or update metadata.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and build, e.g. v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  validate:
    name: validate tag and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Host/Shell release matrix
        # Release-blocking capture cells: Tier 1 zsh, bash, fish, and
        # PowerShell plus the Tier 3 fallback. The checker also rejects a
        # manual or planned cell presented as observed evidence. Manual
        # Windows-runner, macOS Intel, Linux PowerShell, and BSD VM acceptance
        # steps are documented in docs/host-shell-matrix.md; they are not
        # claimed as observations by this fixture. TestCaptureMatrix also
        # replans every path so a startup-file change cannot drift from it.
        run: go test ./adapters/shellhook -run '^(TestCaptureMatrix|TestHostShellMatrix|TestHostShellReleaseGates|TestHostShellMatrixRejectsBadFixtures|TestValidateCellCIRejectsOptionalEvidenceThatCouldGate)$' -count=1 -v

      - name: Read the release version from mygo.json
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${tag}" ]; then
            echo "no release tag was provided" >&2
            exit 1
          fi
          version="$(nu scripts/release.nu version --manifest mygo.json)"
          prerelease="$(nu scripts/release.nu prerelease --manifest mygo.json)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "release tag ${tag} uses mygo.json version ${version} (prerelease=${prerelease})"

      - name: Refuse signing and notarization environment variables
        run: |
          set -euo pipefail
          for name in MYGO_UPDATER_PRIVATE_KEY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID CSC_LINK WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "${name} must not be set: releases are unsigned and never self-update" >&2
              exit 1
            fi
          done
          echo "no signing or notarization environment variables are set"

      - name: Pin the release commit to github.sha
        # There is no caller-supplied commit override. The tag push or the
        # dispatch ref fixes github.sha, and every build job checks out and
        # verifies that one commit.
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${RELEASE_SHA}" ]; then
            echo "checked-out commit ${actual} is not github.sha ${RELEASE_SHA}" >&2
            exit 1
          fi
          echo "release commit ${RELEASE_SHA}"

  capture-linux-amd64:
    name: capture Linux amd64 shells
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the matrix shells
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh bash fish python3-venv libicu74
          curl -fsSL -o nu.tar.gz https://github.com/nushell/nushell/releases/download/0.116.1/nu-0.116.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf nu.tar.gz
          sudo install -m 0755 nu-0.116.1-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          python3 -m venv /opt/xonsh
          /opt/xonsh/bin/pip install --quiet xonsh==0.24.2
          curl -fsSL -o pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-x64.tar.gz
          sudo mkdir -p /opt/pwsh
          sudo tar -xzf pwsh.tar.gz -C /opt/pwsh
          sudo chmod +x /opt/pwsh/pwsh

      - name: Assert the matrix shells
        run: |
          set -euo pipefail
          command -v zsh
          command -v bash
          command -v fish
          command -v nu
          test -x /opt/xonsh/bin/xonsh
          test -x /opt/pwsh/pwsh
          zsh --version
          bash --version | head -1
          fish --version
          nu --version
          /opt/xonsh/bin/xonsh --version
          /opt/pwsh/pwsh --version

      - name: Run the capture matrix
        run: |
          set -euo pipefail
          NETCATTY_TEST_FISH="$(command -v fish)" \
          NETCATTY_TEST_NU="$(command -v nu)" \
          NETCATTY_TEST_XONSH=/opt/xonsh/bin/xonsh \
          NETCATTY_TEST_PWSH=/opt/pwsh/pwsh \
          go test ./adapters/shellhook -run '^(TestRealShellSessionCapturesTierOneEndToEnd|TestRealPowerShellLocalHookCapturesTierOne|TestRealPowerShellSessionCapturesTierOneEndToEnd|TestRealTierThreeFallbackCapturesTypedInput|TestRealPowerShellTierThreeFallback)$' -count=1 -v

      - name: Run the best-effort shells
        # nushell and xonsh are best-effort in the ticket and the matrix: they
        # are not release gates. A failure here is recorded but does not fail
        # the job, so checksums and publish still run.
        continue-on-error: true
        run: |
          set -euo pipefail
          NETCATTY_TEST_NU="$(command -v nu)" \
          NETCATTY_TEST_XONSH=/opt/xonsh/bin/xonsh \
          go test ./adapters/shellhook -run '^(TestRealNushellSessionCapturesTierOneEndToEnd|TestRealXonshSessionCapturesTierOneEndToEnd|TestRealNushellWithoutHookKeepsNativeCapture|TestRealXonshWithoutHookKeepsNativeFallback)$' -count=1 -v

