name: release

# Builds and verifies the release artifacts for every supported platform. A
# pushed strict SemVer tag such as v0.1.0 additionally publishes a GitHub
# release with those artifacts; a tag with a pre-release suffix such as
# v0.1.0-rc.1 publishes a GitHub pre-release that is never marked Latest. Run
# it from the Actions tab (or `gh workflow run release.yml -f tag=v0.1.0`) to
# validate and build without publishing: workflow_dispatch is a dry run that
# creates no release.
#
# Releases stay unsigned apart from MyGo's ad hoc macOS signature and carry no
# notarization, Authenticode, or update metadata.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and build, e.g. v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  validate:
    name: validate tag and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Host/Shell release matrix
        # Release-blocking capture cells: Tier 1 zsh, bash, fish, and
        # PowerShell plus the Tier 3 fallback. The checker also rejects a
        # manual or planned cell presented as observed evidence. Manual
        # Windows-runner, macOS Intel, Linux PowerShell, and BSD VM acceptance
        # steps are documented in docs/host-shell-matrix.md; they are not
        # claimed as observations by this fixture. TestCaptureMatrix also
        # replans every path so a startup-file change cannot drift from it.
        run: go test ./adapters/shellhook -run '^(TestCaptureMatrix|TestHostShellMatrix|TestHostShellReleaseGates|TestHostShellMatrixRejectsBadFixtures)$' -count=1 -v

      - name: Read the release version from mygo.json
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${tag}" ]; then
            echo "no release tag was provided" >&2
            exit 1
          fi
          version="$(nu scripts/release.nu version --manifest mygo.json)"
          prerelease="$(nu scripts/release.nu prerelease --manifest mygo.json)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "release tag ${tag} uses mygo.json version ${version} (prerelease=${prerelease})"

      - name: Refuse signing and notarization environment variables
        run: |
          set -euo pipefail
          for name in MYGO_UPDATER_PRIVATE_KEY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID CSC_LINK WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "${name} must not be set: releases are unsigned and never self-update" >&2
              exit 1
            fi
          done
          echo "no signing or notarization environment variables are set"

      - name: Pin the release commit to github.sha
        # There is no caller-supplied commit override. The tag push or the
        # dispatch ref fixes github.sha, and every build job checks out and
        # verifies that one commit.
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${RELEASE_SHA}" ]; then
            echo "checked-out commit ${actual} is not github.sha ${RELEASE_SHA}" >&2
            exit 1
          fi
          echo "release commit ${RELEASE_SHA}"

  build:
    name: build (${{ matrix.artifact }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NATCATTY_VERSION: ${{ needs.validate.outputs.version }}
      NATCATTY_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: darwin
            os: macos-latest
            platform: darwin/arm64,darwin/amd64
          - artifact: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - artifact: linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Write the Corresponding Source offer into the resources
        run: |
          set -euo pipefail
          go run ./internal/tools/sourceoffer -version "${NATCATTY_VERSION}" \
            -out resources/SOURCE-OFFER.md
          test -s resources/SOURCE-OFFER.md

      - name: Build with MyGo
        run: |
          set -euo pipefail
          sign=()
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # MyGo's default is an ad hoc signature; pass it explicitly so the
            # log states that nothing here is Developer ID signed.
            sign=(-sign -)
          fi
          go tool mygo build -platform "${{ matrix.platform }}" -o dist "${sign[@]}"

      - name: Give every release asset its canonical name
        run: |
          set -euo pipefail
          nu scripts/release.nu rename-assets --dir dist --version "${NATCATTY_VERSION}"
          # MyGo always writes a Linux install.sh beside the archives. Natcatty
          # publishes the tarball and the .deb, not a standalone script.
          rm -f dist/linux-amd64/install.sh dist/linux-arm64/install.sh

      - name: Build the Windows portable archive
        if: matrix.artifact == 'windows-amd64'
        run: |
          set -euo pipefail
          nu scripts/release.nu make-portable \
            --dir dist/windows-amd64 \
            --out "dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip" \
            --exclude "natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"

      - name: Inspect the packaged layout
        run: |
          set -euo pipefail
          resources=(THIRD-PARTY-NOTICES.md
            LICENSE
            NOTICE
            SOURCE-OFFER.md
            CHANGELOG.md
            mygo.json)
          case "${{ matrix.artifact }}" in
            darwin)
              for arch in arm64 amd64; do
                test -s "dist/darwin-${arch}/natcatty-${NATCATTY_VERSION}-macos-${arch}.dmg"
              done
              root="dist/darwin-arm64/Natcatty.app/Contents/Resources"
              ;;
            windows-amd64)
              test -s "dist/windows-amd64/natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"
              test -s "dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip"
              root="dist/windows-amd64"
              ;;
            linux)
              test -s "dist/linux-amd64/natcatty-${NATCATTY_VERSION}-linux-amd64.tar.gz"
              test -s "dist/linux-amd64/natcatty-${NATCATTY_VERSION}-linux-amd64.deb"
              test -s "dist/linux-arm64/natcatty-${NATCATTY_VERSION}-linux-arm64.tar.gz"
              test -s "dist/linux-arm64/natcatty-${NATCATTY_VERSION}-linux-arm64.deb"
              test ! -e "dist/linux-amd64/install.sh"
              test ! -e "dist/linux-arm64/install.sh"
              root="dist/linux-amd64"
              ;;
          esac
          for entry in "${resources[@]}"; do
            test -s "${root}/${entry}"
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${root}/mygo.json"
          if [ "${{ matrix.artifact }}" = "darwin" ]; then
            for arch in arm64 amd64; do
              for entry in "${resources[@]}"; do
                test -s "dist/darwin-${arch}/Natcatty.app/Contents/Resources/${entry}"
              done
              grep -q "\"version\": \"${NATCATTY_VERSION}\"" \
                "dist/darwin-${arch}/Natcatty.app/Contents/Resources/mygo.json"
            done
          fi
          if [ "${{ matrix.artifact }}" = "linux" ]; then
            for entry in "${resources[@]}"; do
              test -s "dist/linux-arm64/${entry}"
            done
          fi
          echo "layout, version, and resources verified"

      - name: Verify the macOS disk images
        if: matrix.artifact == 'darwin'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            dmg="dist/darwin-${arch}/natcatty-${NATCATTY_VERSION}-macos-${arch}.dmg"
            hdiutil verify "${dmg}"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${dmg}" >/dev/null
            cleanup() { hdiutil detach "${mount}" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            app="${mount}/Natcatty.app"
            test -d "${app}"
            plutil -lint "${app}/Contents/Info.plist"
            test "$(plutil -extract CFBundleShortVersionString raw -o - "${app}/Contents/Info.plist")" = "${NATCATTY_VERSION}"
            test "$(plutil -extract CFBundleIdentifier raw -o - "${app}/Contents/Info.plist")" = "io.github.mslxl.natcatty"
            for entry in THIRD-PARTY-NOTICES.md \
              LICENSE \
              NOTICE \
              SOURCE-OFFER.md \
              CHANGELOG.md \
              mygo.json; do
              test -s "${app}/Contents/Resources/${entry}"
            done
            grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${app}/Contents/Resources/mygo.json"
            if find "${mount}" \( -iname 'update-*.json' -o -iname 'latest*.yml' \
              -o -iname 'latest*.yaml' -o -iname 'appcast*.xml' -o -iname '*.delta' \
              -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.mobileprovision' \) \
              -print | grep -q .; then
              echo "the ${arch} disk image contains update or signing metadata" >&2
              exit 1
            fi
            codesign -dv --verbose=4 "${app}" 2>"codesign-${arch}.txt"
            cat "codesign-${arch}.txt"
            grep -q 'Signature=adhoc' "codesign-${arch}.txt"
            if grep -q 'Authority=' "codesign-${arch}.txt"; then
              echo "the ${arch} app carries a distribution signature" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${app}"
            if codesign -dv "${dmg}" 2>&1 | grep -q 'Developer ID'; then
              echo "the ${arch} disk image carries a Developer ID signature" >&2
              exit 1
            fi
            cleanup
            trap - EXIT
            echo "the ${arch} disk image verifies; its app is ad hoc signed and carries no Developer ID"
          done

      - name: Verify the Windows installer
        if: matrix.artifact == 'windows-amd64'
        run: |
          set -euo pipefail
          setup="dist/windows-amd64/natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"
          sevenzip="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          "${sevenzip}" l "${setup}" | tr -d '\r' > nsis-list.txt
          sed -n '1,25p' nsis-list.txt
          grep -q '^Type = Nsis$' nsis-list.txt
          for entry in 'Natcatty.exe' 'mygo.json' 'CHANGELOG.md' 'THIRD-PARTY-NOTICES.md' \
            'LICENSE' 'NOTICE' 'SOURCE-OFFER.md'; do
            grep -Fq "${entry}" nsis-list.txt
          done
          if grep -Ei 'update-.*\.json|latest.*\.(yml|yaml)|appcast.*\.xml|\.delta|\.p12|\.pfx|\.mobileprovision' nsis-list.txt; then
            echo "the installer contains update or signing metadata" >&2
            exit 1
          fi
          "${sevenzip}" x -y -o"nsis-extracted" "${setup}" >/dev/null
          test -s nsis-extracted/Natcatty.exe
          for entry in THIRD-PARTY-NOTICES.md LICENSE NOTICE \
            SOURCE-OFFER.md CHANGELOG.md mygo.json; do
            test -s "nsis-extracted/${entry}"
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" nsis-extracted/mygo.json
          export SETUP_PATH="${setup}"
          powershell -NoProfile -NonInteractive -Command '
            $signature = Get-AuthenticodeSignature -LiteralPath $env:SETUP_PATH
            if ($signature.Status -ne "NotSigned") {
              throw "the Setup exe is signed: $($signature.Status)"
            }
            Write-Host "the Setup exe is unsigned (NotSigned)"
          '
          echo "the NSIS installer lists the app and resources and is unsigned"

          portable="dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip"
          "${sevenzip}" l "${portable}" | tr -d '\r' | tr '\\' '/' > portable-list.txt
          sed -n '1,25p' portable-list.txt
          for entry in 'Natcatty.exe' 'mygo.json' 'CHANGELOG.md' 'THIRD-PARTY-NOTICES.md' \
            'LICENSE' 'NOTICE' 'SOURCE-OFFER.md'; do
            grep -Fq "${entry}" portable-list.txt
          done
          if grep -Fq -- '-setup.exe' portable-list.txt; then
            echo "the portable archive contains the NSIS Setup" >&2
            exit 1
          fi
          echo "the portable archive holds the app and resources without the installer"

      - name: Verify the Linux packages
        if: matrix.artifact == 'linux'
        run: |
          set -euo pipefail
          # MyGo encodes a SemVer pre-release in the Debian version field:
          # 0.1.0-rc.1 becomes 0.1.0~rc.1.
          deb_version="$(nu scripts/release.nu version --manifest mygo.json --debian)"
          for arch in amd64 arm64; do
            deb="dist/linux-${arch}/natcatty-${NATCATTY_VERSION}-linux-${arch}.deb"
            tarball="dist/linux-${arch}/natcatty-${NATCATTY_VERSION}-linux-${arch}.tar.gz"
            test "$(dpkg-deb -f "${deb}" Package)" = "natcatty"
            test "$(dpkg-deb -f "${deb}" Version)" = "${deb_version}"
            test "$(dpkg-deb -f "${deb}" Architecture)" = "${arch}"
            dpkg-deb -c "${deb}" > "deb-${arch}.txt"
            for entry in opt/natcatty/natcatty \
              opt/natcatty/mygo.json \
              opt/natcatty/CHANGELOG.md \
              opt/natcatty/THIRD-PARTY-NOTICES.md \
              opt/natcatty/LICENSE \
              opt/natcatty/NOTICE \
              opt/natcatty/SOURCE-OFFER.md; do
              grep -q "\./${entry}\$" "deb-${arch}.txt"
            done
            tar -tzf "${tarball}" > "tar-${arch}.txt"
            for entry in natcatty mygo.json CHANGELOG.md THIRD-PARTY-NOTICES.md \
              LICENSE NOTICE SOURCE-OFFER.md; do
              grep -Fxq "${entry}" "tar-${arch}.txt"
            done
            extracted="extract-${arch}"
            mkdir -p "${extracted}"
            tar -xzf "${tarball}" -C "${extracted}"
            grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${extracted}/mygo.json"
            echo "linux/${arch} deb and tar.gz carry the app, legal documents, and resources"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natcatty-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  checksums:
    name: aggregate checksums
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Download every platform artifact
        # `natcatty-*` selects exactly the three platform artifacts the build
        # job uploads. The aggregate checksum artifact (`release-checksums`)
        # stays outside the pattern, so a re-run cannot sweep the previous
        # attempt's aggregate file back in.
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: natcatty-*

      - name: Collect the release artifacts
        run: |
          set -euo pipefail
          nu scripts/release.nu collect --from downloads --to release

      - name: Assert the flat release set
        run: |
          set -euo pipefail
          cat > expected.txt <<EOF
          natcatty-${NATCATTY_VERSION}-linux-amd64.deb
          natcatty-${NATCATTY_VERSION}-linux-amd64.tar.gz
          natcatty-${NATCATTY_VERSION}-linux-arm64.deb
          natcatty-${NATCATTY_VERSION}-linux-arm64.tar.gz
          natcatty-${NATCATTY_VERSION}-macos-amd64.dmg
          natcatty-${NATCATTY_VERSION}-macos-arm64.dmg
          natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip
          natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe
          EOF
          sort -o expected.txt expected.txt
          find release -maxdepth 1 -type f -printf '%f\n' | sort > actual.txt
          diff -u expected.txt actual.txt
          test "$(wc -l < actual.txt)" -eq 8
        env:
          NATCATTY_VERSION: ${{ needs.validate.outputs.version }}

      - name: Generate the aggregate checksums
        run: |
          set -euo pipefail
          nu scripts/release.nu generate-sums --dir release
          cat release/SHA256SUMS

      - name: Upload the aggregate checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### Release ${NATCATTY_TAG} artifacts"
            echo
            echo "A tag push attaches these files to the GitHub release for ${NATCATTY_TAG}; a workflow_dispatch run is a dry run that publishes nothing."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          NATCATTY_TAG: ${{ needs.validate.outputs.tag }}

  publish:
    name: publish GitHub release
    # Only a pushed tag publishes. A workflow_dispatch run is always a dry run,
    # even when it is dispatched on a tag ref, so the event name is part of the
    # condition and not just the ref. success() is explicit: a failed or
    # skipped prerequisite in needs must block publication, and this job never
    # uses always() to waive one.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - build
      - checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow as a whole keeps contents: read; only this job may publish.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      NATCATTY_VERSION: ${{ needs.validate.outputs.version }}
      NATCATTY_TAG: ${{ needs.validate.outputs.tag }}
      NATCATTY_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        # scripts/release.nu lives in the repository; nothing is rebuilt.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Download every platform artifact
        # The same pattern as the checksums job: exactly the three platform
        # artifacts, never the aggregate checksum artifact.
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: natcatty-*

      - name: Download the aggregate checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums

      - name: Collect the release artifacts
        run: |
          set -euo pipefail
          nu scripts/release.nu collect --from downloads --to release

      - name: Prove the aggregate checksums are the verified ones
        run: |
          set -euo pipefail
          nu scripts/release.nu generate-sums --dir release
          cmp release/SHA256SUMS checksums/SHA256SUMS
          cat release/SHA256SUMS

      - name: Publish the GitHub release
        # Re-pushing or force-moving a tag is expected, so an existing release
        # is edited and its assets replaced instead of failing. The tag and the
        # release are never deleted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          # The eight installers plus the checksum manifest.
          test "${#assets[@]}" -eq 9
          # GitHub generates the body from the commits and pull requests since
          # the previous release. `gh release edit` cannot regenerate notes, so
          # fetch one body and use it for both the create and edit paths.
          notes="$(mktemp)"
          trap 'rm -f "${notes}"' EXIT
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${NATCATTY_TAG}" --jq .body > "${notes}"
          # A SemVer pre-release is published as a GitHub pre-release and never
          # becomes Latest. A normal release clears a stale pre-release mark.
          flags=(--prerelease=false)
          if [ "${NATCATTY_PRERELEASE}" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          if gh release view "${NATCATTY_TAG}" >/dev/null 2>&1; then
            echo "release ${NATCATTY_TAG} already exists; updating it in place"
            gh release edit "${NATCATTY_TAG}" "${flags[@]}" \
              --title "Natcatty ${NATCATTY_VERSION}" \
              --notes-file "${notes}"
          else
            gh release create "${NATCATTY_TAG}" "${flags[@]}" \
              --verify-tag \
              --title "Natcatty ${NATCATTY_VERSION}" \
              --notes-file "${notes}"
          fi
          gh release upload "${NATCATTY_TAG}" "${assets[@]}" --clobber

      - name: Remove assets that are not part of this release
        # A force-moved tag can publish a different asset set than the previous
        # run. Uploading does not remove files that no longer belong to the
        # release, so delete them and leave exactly the assets this run built
        # and verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          gh release view "${NATCATTY_TAG}" --json assets --jq '.assets[].name' | sort > observed.txt
          comm -13 expected.txt observed.txt > stale.txt
          while IFS= read -r name; do
            echo "removing stale release asset ${name}"
            gh release delete-asset "${NATCATTY_TAG}" "${name}" --yes
          done < stale.txt

          gh release view "${NATCATTY_TAG}" --json url,tagName,assets
