          cache: true

      - name: Assert PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = (Get-Command pwsh).Source
          if (-not (Test-Path -LiteralPath $pwsh)) { throw "pwsh is missing" }
          pwsh --version
          $PSVersionTable.PSVersion

      - name: Run the capture matrix
