name: release

# Builds and verifies the release artifacts for every supported platform. A
# pushed strict SemVer tag such as v0.1.0 additionally publishes a GitHub
# release with those artifacts; a tag with a pre-release suffix such as
# v0.1.0-rc.1 publishes a GitHub pre-release that is never marked Latest. Run
# it from the Actions tab (or `gh workflow run release.yml -f tag=v0.1.0`) to
# validate and build without publishing: workflow_dispatch is a dry run that
# creates no release.
#
# Releases stay unsigned apart from MyGo's ad hoc macOS signature and the
# Android APK, which is signed with natcatty's own keystore material supplied
# to this workflow from secrets. There is no notarization, Authenticode, or
# update metadata, and no store account is involved: the APK is installed from
# the release file.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and build, e.g. v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  validate:
    name: validate tag and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version_code: ${{ steps.android.outputs.version-code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The Android version-code check reads the previous release tag's
          # mygo.json, which needs the tags and the history behind them.
          fetch-depth: 0

      - name: Prepare MyGo
        uses: ./.github/actions/prepare-mygo

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read the release version from mygo.json
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${tag}" ]; then
            echo "no release tag was provided" >&2
            exit 1
          fi
          version="$(nu scripts/release.nu version --manifest mygo.json)"
          prerelease="$(nu scripts/release.nu prerelease --manifest mygo.json)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "release tag ${tag} uses mygo.json version ${version} (prerelease=${prerelease})"

      - name: Check that the Android version code increases
        # Android orders installs by versionCode; a code that does not grow
        # would refuse to install over the previous release. The code is
        # computed from the manifest version (internal/tools/androidversion)
        # and compared with the previous release tag's manifest. A tag that is
        # not checked out (a workflow_dispatch input) compares against the
        # nearest release tag reachable from HEAD instead.
        id: android
        env:
          NATCATTY_VERSION: ${{ steps.tag.outputs.version }}
          NATCATTY_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          code="$(go run ./internal/tools/androidversion -version "${NATCATTY_VERSION}")"
          echo "version-code=${code}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/${NATCATTY_TAG}" >/dev/null; then
            start="${NATCATTY_TAG}^{commit}"
          else
            start="HEAD"
          fi
          if previous_tag="$(git describe --tags --abbrev=0 --match 'v*' "${start}^" 2>/dev/null)"; then
            previous_version="$(git show "${previous_tag}:mygo.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
            go run ./internal/tools/androidversion \
              -version "${NATCATTY_VERSION}" -previous "${previous_version}"
            echo "Android version code ${code} for ${NATCATTY_VERSION} follows ${previous_tag} (${previous_version})"
          else
            echo "no earlier release tag is reachable; Android version code ${code} is the first"
          fi

      - name: Refuse signing material in the checkout
        # The repository ships no Android keystore and no committed keystore
        # path: the release job decodes its own from secrets, and a developer
        # build falls back to the debug key. SSH test fixtures under
        # adapters/ssh/testdata are .pem files and are not Android signing
        # material.
        run: |
          set -euo pipefail
          committed="$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx')"
          if [ -n "${committed}" ]; then
            echo "signing material is committed to the repository:" >&2
            echo "${committed}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("mygo.json") as f:
              manifest = json.load(f)
          if manifest.get("android", {}).get("keystore"):
              sys.exit("mygo.json commits an android.keystore path; the release job supplies it from secrets")
          PY
          echo "the repository carries no Android signing material"

      - name: Refuse signing and notarization environment variables
        run: |
          set -euo pipefail
          for name in MYGO_UPDATER_PRIVATE_KEY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID CSC_LINK WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "${name} must not be set: the desktop releases are unsigned and never self-update" >&2
              exit 1
            fi
          done
          echo "no signing or notarization environment variables are set"

      - name: Pin the release commit to github.sha
        # There is no caller-supplied commit override. The tag push or the
        # dispatch ref fixes github.sha, and every build job checks out and
        # verifies that one commit.
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${RELEASE_SHA}" ]; then
            echo "checked-out commit ${actual} is not github.sha ${RELEASE_SHA}" >&2
            exit 1
          fi
          echo "release commit ${RELEASE_SHA}"

  build:
    name: build (${{ matrix.artifact }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NATCATTY_VERSION: ${{ needs.validate.outputs.version }}
      NATCATTY_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: darwin
            os: macos-latest
            platform: darwin/arm64,darwin/amd64
          - artifact: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - artifact: linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare MyGo
        uses: ./.github/actions/prepare-mygo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Write the Corresponding Source offer into the resources
        run: |
          set -euo pipefail
          go run ./internal/tools/sourceoffer -version "${NATCATTY_VERSION}" \
            -out resources/SOURCE-OFFER.md
          test -s resources/SOURCE-OFFER.md

      - name: Download Windows ConPTY passthrough pair
        if: matrix.artifact == 'windows-amd64'
        run: |
          set -euo pipefail
          nu scripts/conptyfetch.nu --out resources/winconpty
          test -s resources/winconpty/conpty.dll
          test -s resources/winconpty/OpenConsole.exe

      - name: Build with MyGo
        run: |
          set -euo pipefail
          sign=()
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # MyGo's default is an ad hoc signature; pass it explicitly so the
            # log states that nothing here is Developer ID signed.
            sign=(-sign -)
          fi
          go tool mygo build -platform "${{ matrix.platform }}" -o dist "${sign[@]}"

      - name: Give every release asset its canonical name
        run: |
          set -euo pipefail
          nu scripts/release.nu rename-assets --dir dist --version "${NATCATTY_VERSION}"
          # MyGo always writes a Linux install.sh beside the archives. Natcatty
          # publishes the tarball and the .deb, not a standalone script.
          rm -f dist/linux-amd64/install.sh dist/linux-arm64/install.sh

      - name: Build the Windows portable archive
        if: matrix.artifact == 'windows-amd64'
        run: |
          set -euo pipefail
          nu scripts/release.nu make-portable \
            --dir dist/windows-amd64 \
            --out "dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip" \
            --exclude "natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"

      - name: Inspect the packaged layout
        run: |
          set -euo pipefail
          resources=(THIRD-PARTY-NOTICES.md
            LICENSE
            NOTICE
            SOURCE-OFFER.md
            CHANGELOG.md
            mygo.json)
          case "${{ matrix.artifact }}" in
            darwin)
              for arch in arm64 amd64; do
                test -s "dist/darwin-${arch}/natcatty-${NATCATTY_VERSION}-macos-${arch}.dmg"
              done
              root="dist/darwin-arm64/Natcatty.app/Contents/Resources"
              ;;
            windows-amd64)
              test -s "dist/windows-amd64/natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"
              test -s "dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip"
              root="dist/windows-amd64"
              ;;
            linux)
              test -s "dist/linux-amd64/natcatty-${NATCATTY_VERSION}-linux-amd64.tar.gz"
              test -s "dist/linux-amd64/natcatty-${NATCATTY_VERSION}-linux-amd64.deb"
              test -s "dist/linux-arm64/natcatty-${NATCATTY_VERSION}-linux-arm64.tar.gz"
              test -s "dist/linux-arm64/natcatty-${NATCATTY_VERSION}-linux-arm64.deb"
              test ! -e "dist/linux-amd64/install.sh"
              test ! -e "dist/linux-arm64/install.sh"
              root="dist/linux-amd64"
              ;;
          esac
          for entry in "${resources[@]}"; do
            test -s "${root}/${entry}"
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${root}/mygo.json"
          if [ "${{ matrix.artifact }}" = "darwin" ]; then
            for arch in arm64 amd64; do
              for entry in "${resources[@]}"; do
                test -s "dist/darwin-${arch}/Natcatty.app/Contents/Resources/${entry}"
              done
              grep -q "\"version\": \"${NATCATTY_VERSION}\"" \
                "dist/darwin-${arch}/Natcatty.app/Contents/Resources/mygo.json"
            done
          fi
          if [ "${{ matrix.artifact }}" = "linux" ]; then
            for entry in "${resources[@]}"; do
              test -s "dist/linux-arm64/${entry}"
            done
          fi
          echo "layout, version, and resources verified"

      - name: Verify the macOS disk images
        if: matrix.artifact == 'darwin'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            dmg="dist/darwin-${arch}/natcatty-${NATCATTY_VERSION}-macos-${arch}.dmg"
            hdiutil verify "${dmg}"
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${dmg}" >/dev/null
            cleanup() { hdiutil detach "${mount}" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            app="${mount}/Natcatty.app"
            test -d "${app}"
            plutil -lint "${app}/Contents/Info.plist"
            test "$(plutil -extract CFBundleShortVersionString raw -o - "${app}/Contents/Info.plist")" = "${NATCATTY_VERSION}"
            test "$(plutil -extract CFBundleIdentifier raw -o - "${app}/Contents/Info.plist")" = "com.mslxl.natcatty"
            for entry in THIRD-PARTY-NOTICES.md \
              LICENSE \
              NOTICE \
              SOURCE-OFFER.md \
              CHANGELOG.md \
              mygo.json; do
              test -s "${app}/Contents/Resources/${entry}"
            done
            grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${app}/Contents/Resources/mygo.json"
            if find "${mount}" \( -iname 'update-*.json' -o -iname 'latest*.yml' \
              -o -iname 'latest*.yaml' -o -iname 'appcast*.xml' -o -iname '*.delta' \
              -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.mobileprovision' \) \
              -print | grep -q .; then
              echo "the ${arch} disk image contains update or signing metadata" >&2
              exit 1
            fi
            codesign -dv --verbose=4 "${app}" 2>"codesign-${arch}.txt"
            cat "codesign-${arch}.txt"
            grep -q 'Signature=adhoc' "codesign-${arch}.txt"
            if grep -q 'Authority=' "codesign-${arch}.txt"; then
              echo "the ${arch} app carries a distribution signature" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${app}"
            if codesign -dv "${dmg}" 2>&1 | grep -q 'Developer ID'; then
              echo "the ${arch} disk image carries a Developer ID signature" >&2
              exit 1
            fi
            cleanup
            trap - EXIT
            echo "the ${arch} disk image verifies; its app is ad hoc signed and carries no Developer ID"
          done

      - name: Verify the Windows installer
        if: matrix.artifact == 'windows-amd64'
        run: |
          set -euo pipefail
          setup="dist/windows-amd64/natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe"
          sevenzip="$(command -v 7z || echo '/c/Program Files/7-Zip/7z.exe')"
          "${sevenzip}" l "${setup}" | tr -d '\r' > nsis-list.txt
          sed -n '1,25p' nsis-list.txt
          grep -q '^Type = Nsis$' nsis-list.txt
          for entry in 'Natcatty.exe' 'mygo.json' 'CHANGELOG.md' 'THIRD-PARTY-NOTICES.md' \
            'LICENSE' 'NOTICE' 'SOURCE-OFFER.md'; do
            grep -Fq "${entry}" nsis-list.txt
          done
          if grep -Ei 'update-.*\.json|latest.*\.(yml|yaml)|appcast.*\.xml|\.delta|\.p12|\.pfx|\.mobileprovision' nsis-list.txt; then
            echo "the installer contains update or signing metadata" >&2
            exit 1
          fi
          "${sevenzip}" x -y -o"nsis-extracted" "${setup}" >/dev/null
          test -s nsis-extracted/Natcatty.exe
          for entry in THIRD-PARTY-NOTICES.md LICENSE NOTICE \
            SOURCE-OFFER.md CHANGELOG.md mygo.json; do
            test -s "nsis-extracted/${entry}"
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" nsis-extracted/mygo.json
          export SETUP_PATH="${setup}"
          powershell -NoProfile -NonInteractive -Command '
            $signature = Get-AuthenticodeSignature -LiteralPath $env:SETUP_PATH
            if ($signature.Status -ne "NotSigned") {
              throw "the Setup exe is signed: $($signature.Status)"
            }
            Write-Host "the Setup exe is unsigned (NotSigned)"
          '
          echo "the NSIS installer lists the app and resources and is unsigned"

          portable="dist/natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip"
          "${sevenzip}" l "${portable}" | tr -d '\r' | tr '\\' '/' > portable-list.txt
          sed -n '1,25p' portable-list.txt
          for entry in 'Natcatty.exe' 'mygo.json' 'CHANGELOG.md' 'THIRD-PARTY-NOTICES.md' \
            'LICENSE' 'NOTICE' 'SOURCE-OFFER.md'; do
            grep -Fq "${entry}" portable-list.txt
          done
          if grep -Fq -- '-setup.exe' portable-list.txt; then
            echo "the portable archive contains the NSIS Setup" >&2
            exit 1
          fi
          echo "the portable archive holds the app and resources without the installer"

      - name: Verify the Linux packages
        if: matrix.artifact == 'linux'
        run: |
          set -euo pipefail
          # MyGo encodes a SemVer pre-release in the Debian version field:
          # 0.1.0-rc.1 becomes 0.1.0~rc.1.
          deb_version="$(nu scripts/release.nu version --manifest mygo.json --debian)"
          for arch in amd64 arm64; do
            deb="dist/linux-${arch}/natcatty-${NATCATTY_VERSION}-linux-${arch}.deb"
            tarball="dist/linux-${arch}/natcatty-${NATCATTY_VERSION}-linux-${arch}.tar.gz"
            test "$(dpkg-deb -f "${deb}" Package)" = "natcatty"
            test "$(dpkg-deb -f "${deb}" Version)" = "${deb_version}"
            test "$(dpkg-deb -f "${deb}" Architecture)" = "${arch}"
            dpkg-deb -c "${deb}" > "deb-${arch}.txt"
            for entry in opt/natcatty/natcatty \
              opt/natcatty/mygo.json \
              opt/natcatty/CHANGELOG.md \
              opt/natcatty/THIRD-PARTY-NOTICES.md \
              opt/natcatty/LICENSE \
              opt/natcatty/NOTICE \
              opt/natcatty/SOURCE-OFFER.md; do
              grep -q "\./${entry}\$" "deb-${arch}.txt"
            done
            tar -tzf "${tarball}" > "tar-${arch}.txt"
            for entry in natcatty mygo.json CHANGELOG.md THIRD-PARTY-NOTICES.md \
              LICENSE NOTICE SOURCE-OFFER.md; do
              grep -Fxq "${entry}" "tar-${arch}.txt"
            done
            extracted="extract-${arch}"
            mkdir -p "${extracted}"
            tar -xzf "${tarball}" -C "${extracted}"
            grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${extracted}/mygo.json"
            echo "linux/${arch} deb and tar.gz carry the app, legal documents, and resources"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natcatty-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  build-android:
    name: build signed Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      NATCATTY_VERSION: ${{ needs.validate.outputs.version }}
      NATCATTY_TAG: ${{ needs.validate.outputs.tag }}
      NATCATTY_ANDROID_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Set up Java
        # Gradle 8.14.3 and AGP 8.12 ask for a Java 17 toolchain.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform, build tools and NDK
        # android-abis.txt and mygo.json pin the minimum API and the NDK the
        # libghostty-vt archives were built with. Build-tools 35.0.0 supplies
        # zipalign -P 16 and apksigner.
        run: |
          set -euo pipefail
          # A finite answer file, not `yes |`: with pipefail, yes is killed by
          # SIGPIPE when sdkmanager exits and the pipeline's 141 fails the step.
          licenses="${RUNNER_TEMP}/android-licenses.txt"
          printf 'y\n%.0s' {1..100} > "${licenses}"
          sdkmanager --licenses < "${licenses}" >/dev/null
          rm -f "${licenses}"
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;30.0.16248370"

      - name: Build the pinned terminal archives
        # The Android app links one libghostty-vt archive per ABI. Build them
        # from the commit and Zig version recorded in ui/terminal/artifacts.json
        # (both URLs are pinned); the builder verifies every archive's binding
        # symbols, library version and 16 KB pages. --no-manifest leaves the
        # committed manifest untouched in this disposable checkout.
        run: |
          set -euo pipefail
          scripts/mobile/build-ghostty-vt.sh build \
            --platforms android \
            --ndk "${ANDROID_HOME}/ndk/30.0.16248370" \
            --no-manifest

      - name: Stage the terminal archives for cgo
        run: scripts/mobile/android-libs.sh

      - name: Decode the release keystore from secrets
        # The keystore is base64 in a secret and lives only in RUNNER_TEMP,
        # outside the checkout. Base64 keeps the binary intact in a secret.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "secret ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/natcatty-release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          test -s "${keystore}"
          echo "keystore decoded into RUNNER_TEMP"

      - name: Compute and write the Android release manifest
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "secret ANDROID_KEY_ALIAS is not set" >&2
            exit 1
          fi
          # versionCode is an integer Android orders installs by; the
          # committed manifest has none, so the release value comes from the
          # version and is written into this disposable checkout only.
          nu scripts/release.nu android-manifest \
            --keystore "${RUNNER_TEMP}/natcatty-release.keystore" \
            --key-alias "${ANDROID_KEY_ALIAS}" \
            --version-code "${NATCATTY_ANDROID_VERSION_CODE}"

      - name: Build the signed universal APK
        # MyGo builds the Go library for every ABI in scripts/mobile/android-abis.txt
        # with the NDK and 16 KB page alignment, then Gradle packages and signs
        # one APK. Without android.keystore it would sign with the debug key;
        # this job always writes a release keystore first.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "secret ANDROID_KEYSTORE_PASSWORD is not set" >&2
            exit 1
          fi
          export MYGO_ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
          if [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            export MYGO_ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
          fi
          go tool mygo build -platform android -o dist

      - name: Publish the APK, not the store bundle
        run: |
          set -euo pipefail
          # Google Play would take the .aab, but this project distributes the
          # APK from the release file. Keep only the APK and give it its
          # published name.
          rm -f dist/android/*.aab
          nu scripts/release.nu rename-assets --dir dist --version "${NATCATTY_VERSION}"
          apk="dist/android/natcatty-${NATCATTY_VERSION}-android.apk"
          test -s "${apk}"
          test "$(find dist/android -maxdepth 1 -type f | wc -l)" -eq 1
          echo "release artifact: ${apk}"

      - name: Verify the signature and the expected certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="dist/android/natcatty-${NATCATTY_VERSION}-android.apk"
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" | tee apksigner.txt
          grep -qx 'Verifies' apksigner.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' apksigner.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)"
          test -n "${cert}"
          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "repository variable ANDROID_SIGNING_CERT_SHA256 is not set" >&2
            exit 1
          fi
          expected="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr 'A-F' 'a-f')"
          actual="$(printf '%s' "${cert}" | tr 'A-F' 'a-f')"
          if [ "${actual}" != "${expected}" ]; then
            echo "the APK certificate ${actual} is not the expected ${expected}" >&2
            exit 1
          fi
          echo "the APK verifies and reports certificate ${actual}"

      - name: Verify the version code, ABIs and 16 KB pages
        run: |
          set -euo pipefail
          apk="dist/android/natcatty-${NATCATTY_VERSION}-android.apk"
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          # The APK's own manifest, not the manifest this job wrote.
          apkanalyzer="$(command -v apkanalyzer || true)"
          if [ -z "${apkanalyzer}" ]; then
            apkanalyzer="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          fi
          got="$("${apkanalyzer}" manifest version-code "${apk}")"
          if [ "${got}" != "${NATCATTY_ANDROID_VERSION_CODE}" ]; then
            echo "APK versionCode ${got} is not the computed ${NATCATTY_ANDROID_VERSION_CODE}" >&2
            exit 1
          fi
          # zipalign -P 16 checks the uncompressed native libraries' alignment
          # inside the zip; Gradle's useLegacyPackaging=false keeps them
          # uncompressed for direct loading.
          "${build_tools}/zipalign" -c -P 16 4 "${apk}"
          if unzip -v "${apk}" | awk '$2 != "Stored" && $8 ~ /^lib\/.*\/libmygoapp\.so$/ { bad=1 } END { exit bad }'; then
            :
          else
            echo "a native library is compressed in the APK" >&2
            exit 1
          fi
          ndk_root="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/30.0.16248370}"
          ndk_bin="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          # List the archive once, into a file. Piping `unzip -l` straight into
          # `grep -q` would let grep exit after the first match, SIGPIPE unzip,
          # and fail the pipeline under `set -o pipefail`.
          unzip -Z1 "${apk}" > "${work}/entries.txt"
          while read -r abi goarch triple artifact class machine; do
            case "${abi}" in '' | '#'*) continue ;; esac
            entry="lib/${abi}/libmygoapp.so"
            grep -qxF "${entry}" "${work}/entries.txt" || {
              echo "the APK does not ship ${abi} (${entry})" >&2
              exit 1
            }
            unzip -p "${apk}" "${entry}" > "${work}/${abi}.so"
            "${ndk_bin}/llvm-readelf" -h "${work}/${abi}.so" > "${work}/${abi}.hdr"
            grep -q "Machine:.*${machine}$" "${work}/${abi}.hdr" || {
              echo "${abi}: ${entry} is not ${machine}" >&2
              exit 1
            }
            aligns="$("${ndk_bin}/llvm-readelf" -l -W "${work}/${abi}.so" | awk '$1 == "LOAD" { print $NF }')"
            test -n "${aligns}"
            for align in ${aligns}; do
              align=$((align))
              if [ "${align}" -lt 16384 ] || [ $((align & (align - 1))) -ne 0 ]; then
                echo "${abi}: a LOAD segment is aligned to ${align} bytes, want at least 16384" >&2
                exit 1
              fi
            done
            echo "${abi}: ${machine}, 16 KB LOAD segments"
          done < scripts/mobile/android-abis.txt
          echo "the APK ships every supported ABI with 16 KB pages"

      - name: Upload the Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: natcatty-android
          path: dist
          if-no-files-found: error

  checksums:
    name: aggregate checksums
    needs:
      - validate
      - build
      - build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare MyGo
        uses: ./.github/actions/prepare-mygo

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Download every platform artifact
        # `natcatty-*` selects exactly the four platform artifacts the build
        # jobs upload. The aggregate checksum artifact (`release-checksums`)
        # stays outside the pattern, so a re-run cannot sweep the previous
        # attempt's aggregate file back in.
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: natcatty-*

      - name: Collect the release artifacts
        run: |
          set -euo pipefail
          nu scripts/release.nu collect --from downloads --to release

      - name: Assert the flat release set
        run: |
          set -euo pipefail
          cat > expected.txt <<EOF
          natcatty-${NATCATTY_VERSION}-android.apk
          natcatty-${NATCATTY_VERSION}-linux-amd64.deb
          natcatty-${NATCATTY_VERSION}-linux-amd64.tar.gz
          natcatty-${NATCATTY_VERSION}-linux-arm64.deb
          natcatty-${NATCATTY_VERSION}-linux-arm64.tar.gz
          natcatty-${NATCATTY_VERSION}-macos-amd64.dmg
          natcatty-${NATCATTY_VERSION}-macos-arm64.dmg
          natcatty-${NATCATTY_VERSION}-windows-amd64-portable.zip
          natcatty-${NATCATTY_VERSION}-windows-amd64-setup.exe
          EOF
          sort -o expected.txt expected.txt
          find release -maxdepth 1 -type f -printf '%f\n' | sort > actual.txt
          diff -u expected.txt actual.txt
          test "$(wc -l < actual.txt)" -eq 9
        env:
          NATCATTY_VERSION: ${{ needs.validate.outputs.version }}

      - name: Generate the aggregate checksums
        run: |
          set -euo pipefail
          nu scripts/release.nu generate-sums --dir release
          cat release/SHA256SUMS

      - name: Upload the aggregate checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### Release ${NATCATTY_TAG} artifacts"
            echo
            echo "A tag push attaches these files to the GitHub release for ${NATCATTY_TAG}; a workflow_dispatch run is a dry run that publishes nothing."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          NATCATTY_TAG: ${{ needs.validate.outputs.tag }}

  publish:
    name: publish GitHub release
    # Only a pushed tag publishes. A workflow_dispatch run is always a dry run,
    # even when it is dispatched on a tag ref, so the event name is part of the
    # condition and not just the ref. success() is explicit: a failed or
    # skipped prerequisite in needs must block publication, and this job never
    # uses always() to waive one.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - build
      - build-android
      - checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow as a whole keeps contents: read; only this job may publish.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      NATCATTY_VERSION: ${{ needs.validate.outputs.version }}
      NATCATTY_TAG: ${{ needs.validate.outputs.tag }}
      NATCATTY_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        # scripts/release.nu lives in the repository; the app is not rebuilt.
        # Full history and tags let the body step find the previous release
        # even when the tag was re-pushed or force-moved.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Set up Go
        # internal/tools/releasebody composes the release body.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download every platform artifact
        # The same pattern as the checksums job: exactly the four platform
        # artifacts, never the aggregate checksum artifact.
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: natcatty-*

      - name: Download the aggregate checksums
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: checksums

      - name: Collect the release artifacts
        run: |
          set -euo pipefail
          nu scripts/release.nu collect --from downloads --to release

      - name: Prove the aggregate checksums are the verified ones
        run: |
          set -euo pipefail
          nu scripts/release.nu generate-sums --dir release
          cmp release/SHA256SUMS checksums/SHA256SUMS
          cat release/SHA256SUMS

      - name: Compose the release body
        # GitHub generates the notes from the commits and pull requests since
        # the previous release. `gh release edit` cannot regenerate notes, so
        # compose one body here and use it for both the create and edit paths.
        # The identifier-migration note is appended only for the first release
        # whose manifest carries the new identifier; a user who reads only the
        # release page still learns about the one-time reset.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          previous_manifest="${RUNNER_TEMP}/previous-mygo.json"
          : > "${previous_manifest}"
          # The nearest tag reachable from this tag's parent is the release
          # this build upgrades. Comparing manifests rather than release dates
          # keeps a re-pushed tag's body stable.
          if previous_tag="$(git describe --tags --abbrev=0 "${NATCATTY_TAG}^{commit}^" 2>/dev/null)"; then
            git show "${previous_tag}:mygo.json" > "${previous_manifest}" \
              || : > "${previous_manifest}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${NATCATTY_TAG}" --jq .body > "${notes}"
          go run ./internal/tools/releasebody \
            -notes "${notes}" \
            -out "${notes}" \
            -manifest mygo.json \
            -previous-manifest "${previous_manifest}" \
            -fragment docs/releases/identifier-migration.md \
            -append docs/releases/android-apk.md

      - name: Publish the GitHub release
        # Re-pushing or force-moving a tag is expected, so an existing release
        # is edited and its assets replaced instead of failing. The tag and the
        # release are never deleted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          # The nine installers (including the Android APK) plus the checksum
          # manifest.
          test "${#assets[@]}" -eq 10
          notes="${RUNNER_TEMP}/release-notes.md"
          test -s "${notes}"
          # A SemVer pre-release is published as a GitHub pre-release and never
          # becomes Latest. A normal release clears a stale pre-release mark.
          flags=(--prerelease=false)
          if [ "${NATCATTY_PRERELEASE}" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          if gh release view "${NATCATTY_TAG}" >/dev/null 2>&1; then
            echo "release ${NATCATTY_TAG} already exists; updating it in place"
            gh release edit "${NATCATTY_TAG}" "${flags[@]}" \
              --title "Natcatty ${NATCATTY_VERSION}" \
              --notes-file "${notes}"
          else
            gh release create "${NATCATTY_TAG}" "${flags[@]}" \
              --verify-tag \
              --title "Natcatty ${NATCATTY_VERSION}" \
              --notes-file "${notes}"
          fi
          gh release upload "${NATCATTY_TAG}" "${assets[@]}" --clobber

      - name: Remove assets that are not part of this release
        # A force-moved tag can publish a different asset set than the previous
        # run. Uploading does not remove files that no longer belong to the
        # release, so delete them and leave exactly the assets this run built
        # and verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          gh release view "${NATCATTY_TAG}" --json assets --jq '.assets[].name' | sort > observed.txt
          comm -13 expected.txt observed.txt > stale.txt
          while IFS= read -r name; do
            echo "removing stale release asset ${name}"
            gh release delete-asset "${NATCATTY_TAG}" "${name}" --yes
          done < stale.txt

          gh release view "${NATCATTY_TAG}" --json url,tagName,assets
