name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload built artifacts"
        type: boolean
        default: true
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "src/**"
      - "electron/**"
      - "components/**"
      - "domain/**"
      - "application/**"
      - "infrastructure/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.config.cjs"
      - ".github/workflows/build-windows-x64.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-win-x64:
    name: Build Windows x64 App
    runs-on: windows-latest

    env:
      ELECTRON_BUILDER_PUBLISH: "never"
      NODE_OPTIONS: "--disable-warning=DEP0190"

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Setup Node.js 24
        uses: actions/setup-node@main
        with:
          node-version: 24
          cache: "npm"

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Electron Cache
        uses: actions/cache@main
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-win-x64-

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled mosh and et binaries
        shell: pwsh
        run: |
          npm run fetch:mosh:dev --if-present
          npm run fetch:et:dev --if-present

      - name: Build Windows Hello helper
        shell: pwsh
        run: |
          npm run build:windows-hello-helper --if-present

      - name: Package Windows x64 App
        run: npm run pack:win-x64

      - name: Upload Windows x64 Artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_artifact != false }}
        uses: actions/upload-artifact@main
        with:
          name: Netcatty-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
