name: artifact-tests

# Real packaged-artifact evidence for macOS, Linux, and Windows arm64.
#
# This workflow is deliberately separate from release.yml: it is not called by
# the release workflow, does not change the published asset set or the release
# gate, and does not flip ReleasePolicy. It builds the same untagged app users
# receive, launches it from the package, and (on macOS and Linux) drives real
# in-process Mosh and ET Sessions against pinned stock lab servers.
#
# The package jobs do not fetch transport clients. The DMG and Linux tarball
# therefore carry only the committed win32-x64 resources; the Windows arm64
# package removes those too, because no native arm64 client exists. The
# clients exercised by the session jobs are the in-process transports.
#
# Windows arm64 is launch-only: there is no native arm64 mosh-server/etserver
# in the lab, and a hosted Windows arm64 runner cannot execute the x64 lab
# servers. Session tests on Windows arm64 remain a ticket-35 gap.
#
# See docs/ci/artifact-tests.md for the job matrix, lab pins, dispatch
# instructions, and residual CI-only risks.

on:
  workflow_call:
  pull_request:
    paths:
      - "app/**"
      - "scripts/artifact-tests.nu"
      - "docs/packaging.md"
      - "docs/ci/artifact-tests.md"
      - "resources/**"
      - "mygo.json"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/artifact-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  package-macos:
    name: package macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pin every checkout to the caller's commit so a reusable call or a
          # dispatch cannot mix jobs from different trees.
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Write the Corresponding Source offer
        run: |
          set -euo pipefail
          version="$(nu scripts/release.nu version)"
          go run ./internal/tools/sourceoffer -version "${version}" \
            -out resources/SOURCE-OFFER.md
          test -s resources/SOURCE-OFFER.md

      - name: Build the macOS disk image
        run: |
          set -euo pipefail
          # Ad hoc signature only: no Developer ID, notarization, or updater
          # configuration is involved.
          go tool mygo build -platform darwin/universal -o dist -sign -
          version="$(nu scripts/release.nu version)"
          nu scripts/release.nu rename-assets --dir dist --version "${version}"
          dmg="dist/darwin-universal/natcatty-${version}-macos-universal.dmg"
          test -s "${dmg}"
          echo "NATCATTY_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "NATCATTY_DMG=${dmg}" >> "${GITHUB_ENV}"

      - name: Verify the app bundle and the disk image
        run: |
          set -euo pipefail
          resources=(LICENSE NOTICE THIRD-PARTY-NOTICES.md SOURCE-OFFER.md CHANGELOG.md mygo.json
            et/BUILD-PROVENANCE.json et/LICENSE-EternalTerminal-Apache-2.0.txt et/README.md
            mosh/BUILD-PROVENANCE.json mosh/LICENSE-MoshCatty-GPL-3.0.txt
            mosh/LICENSE-MoshGo-MIT.txt mosh/README.md)

          app="dist/darwin-universal/Natcatty.app/Contents/Resources"
          test -d "dist/darwin-universal/Natcatty.app"
          for entry in "${resources[@]}"; do
            test -s "${app}/${entry}"
          done
          # This workflow does not fetch transport clients. The committed
          # win32-x64 resources remain, but no native client may appear.
          test ! -e "${app}/et/darwin-universal"
          test ! -e "${app}/mosh/darwin-universal"

          hdiutil verify "${NATCATTY_DMG}"
          mount="$(mktemp -d)"
          cleanup() { hdiutil detach "${mount}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${NATCATTY_DMG}" >/dev/null
          mounted_app="${mount}/Natcatty.app/Contents/Resources"
          test -d "${mount}/Natcatty.app"
          for entry in "${resources[@]}"; do
            test -s "${mounted_app}/${entry}"
          done
          test ! -e "${mounted_app}/et/darwin-universal"
          test ! -e "${mounted_app}/mosh/darwin-universal"
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${mounted_app}/mygo.json"
          echo "the DMG and its app bundle carry the compliance files and provenance, with no native transport clients"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-macos
          path: ${{ env.NATCATTY_DMG }}
          if-no-files-found: error

  session-macos:
    name: session tests macOS
    needs:
      - package-macos
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Lab-only secret for the provisioned test account. It is never passed
      # on a command line or written to the result.
      NATCATTY_SMOKE_PASSWORD: testpass
      # The runner account carries a Secure Token, so a scripted password
      # reset is refused; authenticate to the lab as the provisioned account
      # instead. The test still runs as the runner user.
      NATCATTY_SMOKE_SSH_USER: tester
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Download the packaged DMG
        uses: actions/download-artifact@v4
        with:
          name: artifact-tests-macos
          path: ${{ runner.temp }}/artifact

      - name: Install the stock ET build dependencies
        run: |
          set -euo pipefail
          brew install cmake gflags protobuf libsodium abseil openssl@3 mosh
          # The SSH bootstrap resolves mosh-server through the remote PATH.
          # /usr/local/bin is always on that PATH; link the Homebrew binary
          # there so a shell startup file cannot hide it.
          sudo ln -sf "$(command -v mosh-server)" /usr/local/bin/mosh-server
          /usr/local/bin/mosh-server --version

      - name: Build stock ET from the pinned source
        run: |
          set -euo pipefail
          # Same pin and build as the macos-native job in et-parity.yml.
          git clone --depth 1 --branch et-v7.1.1 \
            https://github.com/MisterTea/EternalTerminal.git /tmp/et-src
          test "$(git -C /tmp/et-src rev-parse HEAD)" = "a8318ca4598756ca3c5f4711cce12a65faeff57d"
          prefix_path="$(brew --prefix openssl@3):$(brew --prefix protobuf):$(brew --prefix libsodium):$(brew --prefix abseil)"
          cmake -S /tmp/et-src -B /tmp/et-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_VCPKG=ON \
            -DBUILD_TESTING=OFF \
            -DDISABLE_SENTRY=ON \
            -DDISABLE_TELEMETRY=ON \
            -DCMAKE_PREFIX_PATH="${prefix_path}"
          cmake --build /tmp/et-build --target etserver et etterminal -j "$(sysctl -n hw.ncpu)"
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 /tmp/et-build/etserver /tmp/et-build/et /tmp/et-build/etterminal /usr/local/bin/
          /usr/local/bin/etserver --version

      - name: Provision the native lab and start etserver
        run: |
          set -euo pipefail
          chmod +x adapters/et/lab/macos-provision.sh
          adapters/et/lab/macos-provision.sh testpass
          nohup sudo /usr/local/bin/etserver --port 2022 --logtostdout -v 1 \
            >/tmp/etserver.log 2>&1 &
          for _ in $(seq 1 120); do
            if nc -z 127.0.0.1 22 && nc -z 127.0.0.1 2022; then
              exit 0
            fi
            sleep 1
          done
          echo "native lab did not listen on 22 and 2022" >&2
          sudo cat /tmp/etserver.log >&2 || true
          exit 1

      - name: Run the packaged session tests
        run: |
          set -euo pipefail
          dmg="$(find "${RUNNER_TEMP}/artifact" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${dmg}"
          result="${RUNNER_TEMP}/session.json"
          log="${RUNNER_TEMP}/session-driver.log"
          # macOS runners have an OS credential store, so session-only mode
          # is not used here; it fails closed when the OS store is available.
          nu scripts/artifact-tests.nu "${dmg}" \
            --mode session --result "${result}" \
            --ssh-port 22 --et-port 2022 2>&1 | tee "${log}"
          python3 - "${result}" session <<'PY'
          import json
          import sys

          path, want_mode = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)
          checks = {check.get("name"): check.get("ok") for check in result.get("checks", [])}
          failures = []
          if result.get("mode") != want_mode:
              failures.append(f"mode is {result.get('mode')!r}, want {want_mode!r}")
          if not result.get("platform"):
              failures.append("platform is empty")
          for name in ("mosh_command", "et_command"):
              if checks.get(name) is not True:
                  failures.append(f"{name} is not true")
          if failures:
              raise SystemExit("artifact test result invalid: " + ", ".join(failures))
          print("artifact test result:", json.dumps(result, sort_keys=True))
          PY

      - name: Upload the session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-macos-session
          path: |
            ${{ runner.temp }}/session.json
            ${{ runner.temp }}/session-driver.log
            /tmp/etserver.log
          if-no-files-found: warn

  package-linux:
    name: package Linux amd64 tarball and deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Write the Corresponding Source offer
        run: |
          set -euo pipefail
          version="$(nu scripts/release.nu version)"
          go run ./internal/tools/sourceoffer -version "${version}" \
            -out resources/SOURCE-OFFER.md
          test -s resources/SOURCE-OFFER.md

      - name: Build the Linux packages
        run: |
          set -euo pipefail
          go tool mygo build -platform linux/amd64 -o dist
          version="$(nu scripts/release.nu version)"
          nu scripts/release.nu rename-assets --dir dist --version "${version}"
          tarball="dist/linux-amd64/natcatty-${version}-linux-amd64.tar.gz"
          deb="dist/linux-amd64/natcatty-${version}-linux-amd64.deb"
          test -s "${tarball}"
          test -s "${deb}"
          echo "NATCATTY_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "NATCATTY_TARBALL=${tarball}" >> "${GITHUB_ENV}"
          echo "NATCATTY_DEB=${deb}" >> "${GITHUB_ENV}"

      - name: Verify the tarball layout
        run: |
          set -euo pipefail
          entries=(natcatty mygo.json CHANGELOG.md THIRD-PARTY-NOTICES.md LICENSE NOTICE SOURCE-OFFER.md
            et/BUILD-PROVENANCE.json et/LICENSE-EternalTerminal-Apache-2.0.txt et/README.md
            mosh/BUILD-PROVENANCE.json mosh/LICENSE-MoshCatty-GPL-3.0.txt
            mosh/LICENSE-MoshGo-MIT.txt mosh/README.md)
          tar -tzf "${NATCATTY_TARBALL}" > tar-list.txt
          for entry in "${entries[@]}"; do
            grep -Fxq "${entry}" tar-list.txt
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" mygo.json
          # No transport clients were fetched for this build.
          if grep -Eq '^(et|mosh)/linux-(x64|arm64)(/|$)' tar-list.txt; then
            echo "the tarball unexpectedly carries a native Linux transport client" >&2
            grep -E '^(et|mosh)/linux-(x64|arm64)(/|$)' tar-list.txt >&2
            exit 1
          fi
          echo "the tarball carries the app, compliance files, provenance, and no Linux transport clients"

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-linux
          path: |
            ${{ env.NATCATTY_TARBALL }}
            ${{ env.NATCATTY_DEB }}
          if-no-files-found: error

  session-linux:
    name: session tests Linux
    needs:
      - package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Lab-only secret for the account created in the container. It is never
      # passed on a command line or written to the result.
      NATCATTY_SMOKE_PASSWORD: testpass
      # The app forwards LANG/LC_* to mosh-server. The pinned Debian 12 lab
      # ships only C/C.utf8, so pin a locale the container can serve instead of
      # inheriting a runner default such as en_US.UTF-8.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Download the packaged tarball
        uses: actions/download-artifact@v4
        with:
          name: artifact-tests-linux
          path: ${{ runner.temp }}/artifact

      - name: Install the headless host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk

      - name: Build the pinned ET lab image
        run: |
          set -euo pipefail
          docker compose -f adapters/et/lab/compose.yaml build debian12-et711

      - name: Start the lab container
        run: |
          set -euo pipefail
          container="natcatty-artifact-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "${container}" >/dev/null 2>&1 || true
          docker run -d --name "${container}" \
            -p 127.0.0.1:2322:22 \
            -p 127.0.0.1:24607:24607/udp \
            natcatty-et-parity-debian12-et711:latest
          echo "NATCATTY_LAB_CONTAINER=${container}" >> "${GITHUB_ENV}"
          for _ in $(seq 1 120); do
            if nc -z 127.0.0.1 2322; then
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 2322
          # etserver listens on 2022 inside the container; ET reaches it over
          # the SSH forwarding channel, so that port is not published. The
          # entrypoint starts sshd before exec'ing etserver, so retry the
          # container-local probe instead of racing the ET server start.
          for _ in $(seq 1 120); do
            if docker exec "${container}" bash -c 'exec 3<>/dev/tcp/127.0.0.1/2022' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "${container}" bash -c 'exec 3<>/dev/tcp/127.0.0.1/2022'

      - name: Install mosh 1.4.0 and prepare the lab account
        run: |
          set -euo pipefail
          container="${NATCATTY_LAB_CONTAINER}"
          docker exec "${container}" bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mosh
          '
          mosh_version="$(docker exec "${container}" mosh-server --version)"
          printf '%s\n' "${mosh_version}"
          printf '%s\n' "${mosh_version}" | grep -Eq 'mosh(-server)? 1\.4\.0'
          # The session test uses the current OS user; create the same account in
          # the container with the same secret as NATCATTY_SMOKE_PASSWORD.
          docker exec -e SMOKE_USER="${USER}" -e SMOKE_PASSWORD="${NATCATTY_SMOKE_PASSWORD}" \
            "${container}" bash -euc '
            if ! id "${SMOKE_USER}" >/dev/null 2>&1; then
              useradd -m -s /bin/bash "${SMOKE_USER}"
            fi
            printf "%s:%s\n" "${SMOKE_USER}" "${SMOKE_PASSWORD}" | chpasswd
          '
          # Force the lab UDP port and bind address, keeping the
          # client-supplied "new" subcommand as mosh-server's first argument.
          docker exec -i "${container}" tee /usr/local/bin/mosh-server >/dev/null <<'WRAPPER'
          #!/bin/sh
          cmd="$1"; shift
          exec /usr/bin/mosh-server "$cmd" -p 24607 -i 0.0.0.0 "$@"
          WRAPPER
          docker exec "${container}" chmod 0755 /usr/local/bin/mosh-server

      - name: Run the packaged session tests
        run: |
          set -euo pipefail
          tarball="$(find "${RUNNER_TEMP}/artifact" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${tarball}"
          result="${RUNNER_TEMP}/session.json"
          log="${RUNNER_TEMP}/session-driver.log"
          nu scripts/artifact-tests.nu "${tarball}" \
            --mode session --result "${result}" \
            --ssh-port 2322 --et-port 2022 --session-secrets 2>&1 | tee "${log}"
          python3 - "${result}" session <<'PY'
          import json
          import sys

          path, want_mode = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              result = json.load(handle)
          checks = {check.get("name"): check.get("ok") for check in result.get("checks", [])}
          failures = []
          if result.get("mode") != want_mode:
              failures.append(f"mode is {result.get('mode')!r}, want {want_mode!r}")
          if not result.get("platform"):
              failures.append("platform is empty")
          for name in ("mosh_command", "et_command"):
              if checks.get(name) is not True:
                  failures.append(f"{name} is not true")
          if failures:
              raise SystemExit("artifact test result invalid: " + ", ".join(failures))
          print("artifact test result:", json.dumps(result, sort_keys=True))
          PY

      - name: Collect the lab logs and stop the container
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${NATCATTY_LAB_CONTAINER:-}" ]; then
            docker logs "${NATCATTY_LAB_CONTAINER}" > "${RUNNER_TEMP}/lab-container.log" 2>&1 || true
            docker rm -f "${NATCATTY_LAB_CONTAINER}" >/dev/null 2>&1 || true
          fi

      - name: Upload the session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-linux-session
          path: |
            ${{ runner.temp }}/session.json
            ${{ runner.temp }}/session-driver.log
            ${{ runner.temp }}/lab-container.log
          if-no-files-found: warn

  package-windows-arm64:
    name: package Windows arm64 portable zip
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Remove the committed x64 transport clients
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' mygo.json | head -n 1)"
          test -n "${version}"
          echo "NATCATTY_VERSION=${version}" >> "${GITHUB_ENV}"
          # The arm64 app ships no bundled clients: there is no native arm64
          # mosh/ET asset, and x64 clients cannot run on this target.
          rm -rf resources/et/win32-x64 resources/mosh/win32-x64
          test ! -e resources/et/win32-x64
          test ! -e resources/mosh/win32-x64
          if find resources/et resources/mosh -mindepth 1 -type d -print -quit | grep -q .; then
            echo "a transport client directory remains under resources/et or resources/mosh" >&2
            find resources/et resources/mosh -mindepth 1 -type d >&2
            exit 1
          fi

      - name: Write the Corresponding Source offer
        run: |
          set -euo pipefail
          go run ./internal/tools/sourceoffer -version "${NATCATTY_VERSION}" \
            -out resources/SOURCE-OFFER.md
          test -s resources/SOURCE-OFFER.md

      - name: Build the Windows arm64 app
        run: |
          set -euo pipefail
          # NSIS may be present on the runner; the installer is irrelevant
          # here and is excluded from the portable archive below.
          go tool mygo build -platform windows/arm64 -o dist

      - name: Verify the Windows arm64 layout
        run: |
          set -euo pipefail
          root="dist/windows-arm64"
          test -s "${root}/Natcatty.exe"
          entries=(mygo.json CHANGELOG.md THIRD-PARTY-NOTICES.md LICENSE NOTICE SOURCE-OFFER.md
            et/BUILD-PROVENANCE.json et/LICENSE-EternalTerminal-Apache-2.0.txt et/README.md
            mosh/BUILD-PROVENANCE.json mosh/LICENSE-MoshCatty-GPL-3.0.txt
            mosh/LICENSE-MoshGo-MIT.txt mosh/README.md)
          for entry in "${entries[@]}"; do
            test -s "${root}/${entry}"
          done
          grep -q "\"version\": \"${NATCATTY_VERSION}\"" "${root}/mygo.json"
          if find "${root}/et" "${root}/mosh" -mindepth 1 -type d -print -quit | grep -q .; then
            echo "the arm64 package carries a bundled client directory" >&2
            find "${root}/et" "${root}/mosh" -mindepth 1 -type d >&2
            exit 1
          fi
          if find "${root}/et" "${root}/mosh" -type f \( -iname '*.exe' -o -name 'mosh-client*' \) -print -quit | grep -q .; then
            echo "the arm64 package carries a bundled client binary" >&2
            exit 1
          fi
          echo "the arm64 app carries compliance files and provenance with no bundled clients"

      - name: Build the portable archive
        shell: pwsh
        run: |
          $root = "dist/windows-arm64"
          $zip = "dist/natcatty-$env:NATCATTY_VERSION-windows-arm64-portable.zip"
          $staging = Join-Path $env:RUNNER_TEMP "windows-arm64-portable"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $root "*") -Destination $staging -Recurse -Force
          # NSIS, when present, names its installer "Natcatty Setup <version>
          # arm64.exe"; a canonical name would end in -setup.exe. Exclude both.
          $setups = Get-ChildItem -LiteralPath $staging -Recurse -File |
            Where-Object { $_.Name -like "*-setup.exe" -or $_.Name -like "* Setup *.exe" }
          $setups | Remove-Item -Force
          if (Get-ChildItem -LiteralPath $staging -Recurse -File |
              Where-Object { $_.Name -like "*-setup.exe" -or $_.Name -like "* Setup *.exe" }) {
            throw "the portable staging tree still contains an installer"
          }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @("Natcatty.exe", "mygo.json", "CHANGELOG.md",
                "THIRD-PARTY-NOTICES.md", "LICENSE", "NOTICE", "SOURCE-OFFER.md",
                "et/BUILD-PROVENANCE.json", "et/LICENSE-EternalTerminal-Apache-2.0.txt",
                "et/README.md", "mosh/BUILD-PROVENANCE.json",
                "mosh/LICENSE-MoshCatty-GPL-3.0.txt", "mosh/LICENSE-MoshGo-MIT.txt",
                "mosh/README.md")) {
              if ($entries -notcontains $required) {
                throw "the portable archive is missing $required"
              }
            }
            if ($entries | Where-Object { $_ -match '(^|/)(et|mosh)/[^/]+/' }) {
              throw "the portable archive contains a bundled client directory"
            }
            if ($entries | Where-Object { $_ -match '(^|/)([^/]*-setup\.exe|[^/]* Setup [^/]*\.exe)$' }) {
              throw "the portable archive contains an installer"
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "wrote $zip with $($entries.Count) entries and no bundled clients or installer"

      - name: Upload the Windows arm64 portable archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-windows-arm64
          path: dist/natcatty-*-windows-arm64-portable.zip
          if-no-files-found: error

  launch-windows-arm64:
    name: launch tests Windows arm64
    needs:
      - package-windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download the portable archive
        uses: actions/download-artifact@v4
        with:
          name: artifact-tests-windows-arm64
          path: ${{ runner.temp }}/artifact

      - name: Extract and inspect the app tree
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "artifact") `
            -Filter "*.zip" -File | Select-Object -First 1
          if ($null -eq $zip) { throw "the downloaded artifact has no portable zip" }
          $app = Join-Path $env:RUNNER_TEMP "app"
          Remove-Item -LiteralPath $app -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $app -Force
          if (-not (Test-Path -LiteralPath (Join-Path $app "Natcatty.exe"))) {
            throw "Natcatty.exe is missing from the portable archive"
          }
          foreach ($kind in @("et", "mosh")) {
            $kindRoot = Join-Path $app $kind
            if (-not (Test-Path -LiteralPath $kindRoot)) {
              throw "$kind metadata directory is missing"
            }
            $dirs = @(Get-ChildItem -LiteralPath $kindRoot -Directory -Recurse)
            if ($dirs.Count -ne 0) {
              throw "bundled $kind client directory in the arm64 package: $($dirs.FullName -join ', ')"
            }
            $binaries = @(Get-ChildItem -LiteralPath $kindRoot -Recurse -File |
              Where-Object { $_.Name -like "*.exe" -or $_.Name -like "mosh-client*" })
            if ($binaries.Count -ne 0) {
              throw "bundled $kind client binary in the arm64 package: $($binaries.FullName -join ', ')"
            }
          }
          Write-Host "the arm64 package has no bundled client directories or binaries"

      - name: Launch the app and validate the result
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "app"
          $resultPath = Join-Path $env:RUNNER_TEMP "launch.json"
          $profilePath = Join-Path $env:RUNNER_TEMP "profile"
          Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $profilePath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $profilePath -Force | Out-Null

          $env:NATCATTY_SMOKE = "1"
          $env:NATCATTY_SMOKE_MODE = "launch"
          $env:NATCATTY_SMOKE_RESULT = $resultPath
          $env:NATCATTY_SMOKE_PROFILE = $profilePath

          # Windows GUI builds have no usable stdout; the result file and the
          # process exit code are authoritative. Wait-Process supplies a hard
          # deadline that Start-Process -Wait lacks.
          $process = Start-Process -FilePath (Join-Path $app "Natcatty.exe") -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 180 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Natcatty.exe did not exit within 180 seconds"
          }
          $process.Refresh()
          $exitCode = $process.ExitCode
          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw "Natcatty.exe exited $exitCode without writing a result file"
          }
          $result = Get-Content -Raw -LiteralPath $resultPath | ConvertFrom-Json
          $checks = @{}
          foreach ($check in @($result.checks)) {
            $checks[[string]$check.name] = [bool]$check.ok
          }
          if ($result.mode -ne "launch") { throw "result mode $($result.mode) is not launch" }
          if ([string]::IsNullOrWhiteSpace([string]$result.platform)) {
            throw "result platform is empty"
          }
          if ($result.platform -ne "windows/arm64") {
            throw "result platform $($result.platform) is not windows/arm64"
          }
          if (-not $checks.ContainsKey("window_visible") -or $checks["window_visible"] -ne $true) {
            throw "the window_visible check is not true"
          }
          if ($exitCode -ne 0) { throw "Natcatty.exe exited $exitCode" }
          Write-Host "packaged launch test passed on $($result.platform)"

      - name: Upload the launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-tests-windows-arm64-launch
          path: |
            ${{ runner.temp }}/launch.json
            ${{ runner.temp }}/profile
          if-no-files-found: warn
