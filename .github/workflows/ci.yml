name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: architecture-and-i18n
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build launch smoke binary
        run: go build -tags launchsmoke ./...

      - name: Test
        run: go test ./...

      - name: Check i18n catalogs
        run: go tool mygo i18n check

      - name: Vet MyGo usage
        run: go tool mygo vet

      - name: Verify generated accessors are committed
        run: |
          go tool mygo generate
          git diff --exit-code -- ui/locales
