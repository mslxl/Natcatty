name: ci

on:
  # Documentation and legal-text-only changes skip the code checks. Any code,
  # workflow, script, resource, or build-input change still runs the full set.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        # The runner image has no font covering Han or Hangul, so the shipped
        # zh-CN and zh-TW text renders no glyphs through Pango: MyGo skips the
        # boxes Pango draws for unknown glyphs, so the real-size tests see no
        # ink. The ink classifier names the missing font when that happens.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Build launch smoke binary
        run: go build -tags launchsmoke ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Check Host/Shell release matrix
        # The fixture and checker are pure Go/JSON, so this runs on every
        # runner. It fails a release-blocking cell that is missing, below its
        # required tier, or claims an observation this machine did not make.
        # TestCaptureMatrix replans the paths; it normalizes host path
        # separators so the same fixture is checked on Windows too.
        run: go test ./adapters/shellhook -run '^(TestCaptureMatrix|TestHostShellMatrix|TestHostShellReleaseGates|TestHostShellMatrixRejectsBadFixtures|TestValidateCellCIRejectsOptionalEvidenceThatCouldGate)$' -count=1 -v

      - name: Confirm real-network tests skip without credentials
        # Default CI has no tailnet and no WireGuard peer. The opt-in tests are
        # compiled into the normal test binaries and must report SKIP, never a
        # silent pass, when their credentials are absent. Fail if someone wires
        # real credentials into the default jobs: those belong to a separate,
        # explicitly opted-in run.
        run: |
          set -euo pipefail
          for name in \
            NETCATTY_TAILSCALE_AUTH_KEY NETCATTY_TAILSCALE_HOST \
            NETCATTY_TAILSCALE_SSH_USER NATCATTY_WIREGUARD_E2E \
            NATCATTY_WIREGUARD_E2E_PRIVATE_KEY \
            NATCATTY_WIREGUARD_E2E_PEER_PUBLIC_KEY \
            NATCATTY_WIREGUARD_E2E_PEER_ENDPOINT \
            NATCATTY_WIREGUARD_E2E_ALLOWED_IPS \
            NATCATTY_WIREGUARD_E2E_TARGET; do
            if [ -n "${!name:-}" ]; then
              echo "${name} must not be set for the default CI jobs" >&2
              exit 1
            fi
          done
          go test ./adapters/tailscale ./adapters/wireguard \
            -run 'TestReal' -count=1 -v | tee real-network-tests.txt
          grep -q -- '--- SKIP: TestRealTailnetSSH' real-network-tests.txt
          grep -q -- '--- SKIP: TestRealPeerTCP' real-network-tests.txt
          grep -q 'skipping the real tailnet SSH test' real-network-tests.txt
          grep -q 'set NATCATTY_WIREGUARD_E2E=1 to run the real-peer test' real-network-tests.txt
          echo "real-network tests skipped with explicit messages"

      - name: Check architecture
        run: go test ./internal/archtest -count=1

      - name: Check i18n catalogs
        run: go test ./ui/locales -count=1

      - name: Check i18n with MyGo
        run: go tool mygo i18n check

      - name: Vet MyGo usage
        run: go tool mygo vet

      - name: Verify generated accessors are committed
        run: |
          go tool mygo generate
          git diff --exit-code -- ui/locales

      - name: Cross-compile supported targets
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            echo "cross-compiled $target"
          done

  race:
    name: race (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The race detector needs cgo. Release builds stay CGO_ENABLED=0.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        # Same reason as the checks job: the image has no font covering Han or
        # Hangul, and the real-size settings tests render the shipped zh-CN and
        # zh-TW text through Pango.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Check for a C compiler
        id: cc
        run: |
          if command -v gcc >/dev/null 2>&1 || command -v cc >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No C compiler found; skipping the race detector job."
          fi

      - name: Race tests
        if: steps.cc.outputs.available == 'true'
        run: go test -race ./... -count=1

  launch-smoke:
    name: launch smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      # TestLaunchSmoke is compiled into the default test binary but does not
      # pop a window unless this is set. This job is the CI evidence for
      # shell.launch and for a real application launch on every platform.
      NATCATTY_LAUNCH_SMOKE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Xvfb and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          fc-cache -f

      - name: Launch the app and await window readiness (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            go test -tags launchsmoke ./app -run TestLaunchSmoke -count=1 -v

      - name: Launch the app and await window readiness (macOS and Windows)
        if: runner.os != 'Linux'
        run: go test -tags launchsmoke ./app -run TestLaunchSmoke -count=1 -v
