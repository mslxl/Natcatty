name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paritygen checks original paths at 73d15da7, which needs history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        # The runner image has no font covering Han or Hangul, so the shipped
        # zh-CN and zh-TW text renders no glyphs through Pango: MyGo skips the
        # boxes Pango draws for unknown glyphs, so the real-size tests see no
        # ink. The ink classifier names the missing font when that happens.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Build launch smoke binary
        run: go build -tags launchsmoke ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Check architecture
        run: go test ./internal/archtest -count=1

      - name: Check i18n catalogs
        run: go test ./ui/locales -count=1

      - name: Check i18n with MyGo
        run: go tool mygo i18n check

      - name: Vet MyGo usage
        run: go tool mygo vet

      - name: Verify generated accessors are committed
        run: |
          go tool mygo generate
          git diff --exit-code -- ui/locales

      - name: Check parity matrix
        run: go run ./internal/tools/paritygen -check

      - name: Cross-compile supported targets
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            echo "cross-compiled $target"
          done

  race:
    name: race (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The race detector needs cgo. Release builds stay CGO_ENABLED=0.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        # Same reason as the checks job: the image has no font covering Han or
        # Hangul, and the real-size settings tests render the shipped zh-CN and
        # zh-TW text through Pango.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Check for a C compiler
        id: cc
        run: |
          if command -v gcc >/dev/null 2>&1 || command -v cc >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No C compiler found; skipping the race detector job."
          fi

      - name: Race tests
        if: steps.cc.outputs.available == 'true'
        run: |
          set -o pipefail
          go test -race ./... -count=1 2>&1 | tee "$RUNNER_TEMP/race-tests.log"

      - name: Report race test failure
        # The job log needs a signed-in session, so on failure the failing
        # package/test lines and the output tail are published where the run
        # page shows them.
        if: failure() && steps.cc.outputs.available == 'true'
        run: |
          log="$RUNNER_TEMP/race-tests.log"
          {
            echo '### Race tests failed'
            echo '```'
            grep -nE '^(--- FAIL|FAIL|WARNING: DATA RACE|panic:)' "$log" | head -n 40 || true
            echo '```'
            echo '```'
            tail -n 200 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=$(grep -E '^(--- FAIL|FAIL|WARNING: DATA RACE|panic:)' "$log" | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Race tests failed::${message:0:60000}"

  launch-smoke:
    name: launch smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      # TestLaunchSmoke is compiled into the default test binary but does not
      # pop a window unless this is set. This job is the CI evidence for
      # shell.launch and for a real application launch on every platform.
      NATCATTY_LAUNCH_SMOKE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Xvfb and CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          fc-cache -f

      - name: Launch the app and await window readiness (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            go test -tags launchsmoke ./app -run TestLaunchSmoke -count=1 -v

      - name: Launch the app and await window readiness (macOS and Windows)
        if: runner.os != 'Linux'
        run: go test -tags launchsmoke ./app -run TestLaunchSmoke -count=1 -v
